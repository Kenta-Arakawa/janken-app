<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけんアプリ</title>
</head>
<body>
    <h1>じゃんけんアプリ</h1>
    <button onclick="playGame('グー')">グー</button>
    <button onclick="playGame('チョキ')">チョキ</button>
    <button onclick="playGame('パー')">パー</button>

    <p>あなたの手：<span id="user_hand"></span></p>
    <p>コンピュータの手：<span id="pc_hand"></span></p>
    <p>結果：<span id="result"></span></p>

    <p>勝ち数：<span id="winCount">0</span></p>
    <p>負け数：<span id="loseCount">0</span></p>
    <p>引き分け数：<span id="drawCount">0</span></p>


    <button onclick="resetGame()">リセット</button>
<script src="script.js"></script>
</body>
</html>
